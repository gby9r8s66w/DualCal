<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="description" content="Offline-first dual Gregorian–Hijri calendar with live solar time, moon phase and a sky that breathes with the sun.">
<meta name="theme-color" content="#0a1128" id="metaTheme">
<title>Dual Calendar Sky</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="app">
  <header id="topbar"></header>
  <nav id="tabs" role="tablist" aria-label="Sections"></nav>
  <div id="banners"></div>
  <main id="main">
    <section id="panel-today"    role="tabpanel" tabindex="0"></section>
    <section id="panel-calendar" role="tabpanel" tabindex="0" hidden></section>
    <section id="panel-solar"    role="tabpanel" tabindex="0" hidden></section>
    <section id="panel-moon"     role="tabpanel" tabindex="0" hidden></section>
    <section id="panel-holidays" role="tabpanel" tabindex="0" hidden></section>
    <section id="panel-settings" role="tabpanel" tabindex="0" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<noscript><p style="padding:2rem;font-family:sans-serif">This widget requires JavaScript. All computation happens locally on your device.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
